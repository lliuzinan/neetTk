<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1800" viewBox="0 0 900 1800" role="img" aria-labelledby="title description">
  <title id="title">The gas route in human respiration</title>
  <desc id="description">Four vertically ordered stages show ventilation, alveolar exchange, blood transport and tissue exchange. Blue arrows show oxygen entering blood and moving to tissues; amber arrows show carbon dioxide moving from tissues toward alveolar air. Oxygen is shown on haemoglobin in a red blood cell, while bicarbonate is shown in plasma.</desc>
  <rect width="900" height="1800" fill="#f8faf6"/>
  <text x="55" y="85" fill="#173c43" font-family="Arial, sans-serif" font-size="45" font-weight="700">The gas route in human respiration</text>
  <g fill="#fff" stroke="#d7e5df" stroke-width="4">
    <rect x="48" y="145" width="804" height="330" rx="30"/>
    <rect x="48" y="560" width="804" height="330" rx="30"/>
    <rect x="48" y="975" width="804" height="330" rx="30"/>
    <rect x="48" y="1390" width="804" height="330" rx="30"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="43" font-weight="700" fill="#173c43">
    <text x="88" y="218">1  Ventilation</text>
    <text x="88" y="633">2  Alveolar exchange</text>
    <text x="88" y="1048">3  Blood transport</text>
    <text x="88" y="1463">4  Tissue exchange</text>
  </g>
  <g stroke="#b7c9c7" stroke-width="14" fill="none" stroke-linecap="round">
    <path d="M 450,475 V 538"/><path d="M 450,890 V 953"/><path d="M 450,1305 V 1368"/>
  </g>
  <g fill="#b7c9c7"><path d="M 450,545 l -23,-27 h 46 z"/><path d="M 450,960 l -23,-27 h 46 z"/><path d="M 450,1375 l -23,-27 h 46 z"/></g>
  <!-- Air moves down an airway into alveolar sacs. -->
  <g stroke="#739a9d" stroke-width="17" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 450,250 V 342 M 450,337 L 372,394 M 450,337 L 528,394"/>
  </g>
  <g fill="#e7f1ed" stroke="#739a9d" stroke-width="6">
    <circle cx="364" cy="406" r="38"/><circle cx="414" cy="413" r="38"/><circle cx="486" cy="413" r="38"/><circle cx="536" cy="406" r="38"/>
  </g>
  <path d="M 450,262 V 304" stroke="#187daa" stroke-width="18" stroke-linecap="round"/>
  <path d="M 450,322 l -24,-31 h 48 z" fill="#187daa"/>
  <!-- Alveolar exchange in opposite directions. -->
  <circle cx="333" cy="746" r="92" fill="#e7f1ed" stroke="#739a9d" stroke-width="7"/>
  <rect x="611" y="654" width="83" height="188" rx="40" fill="#f9e5de" stroke="#c17f78" stroke-width="6"/>
  <path d="M 420,708 H 607" stroke="#187daa" stroke-width="18" stroke-linecap="round"/>
  <path d="M 608,708 l -29,-21 v 42 z" fill="#187daa"/>
  <path d="M 606,783 H 423" stroke="#dd8c16" stroke-width="18" stroke-linecap="round"/>
  <path d="M 422,783 l 29,-21 v 42 z" fill="#dd8c16"/>
  <!-- Blood transport keeps bicarbonate outside the erythrocyte. -->
  <rect x="420" y="1078" width="370" height="175" rx="84" fill="#e8f3ef" stroke="#8bb0af" stroke-width="6"/>
  <ellipse cx="537" cy="1161" rx="80" ry="58" fill="#e9a29b" stroke="#bb655f" stroke-width="7"/>
  <ellipse cx="537" cy="1161" rx="38" ry="22" fill="#f8c9c1"/>
  <circle cx="697" cy="1201" r="15" fill="#dd8c16"/><circle cx="739" cy="1176" r="15" fill="#dd8c16"/>
  <circle cx="517" cy="1156" r="14" fill="#187daa"/>
  <g font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#173c43">
    <text x="90" y="1153">O₂: Hb in RBC</text>
    <text x="90" y="1206">CO₂: HCO₃⁻ in plasma</text>
  </g>
  <!-- Tissue exchange: oxygen out of blood, carbon dioxide into blood. -->
  <rect x="240" y="1500" width="77" height="167" rx="38" fill="#f9e5de" stroke="#c17f78" stroke-width="6"/>
  <g fill="#e7f1ed" stroke="#739a9d" stroke-width="6">
    <circle cx="610" cy="1558" r="43"/><circle cx="686" cy="1622" r="43"/><circle cx="560" cy="1640" r="43"/>
  </g>
  <path d="M 317,1559 H 544" stroke="#187daa" stroke-width="18" stroke-linecap="round"/>
  <path d="M 545,1559 l -29,-21 v 42 z" fill="#187daa"/>
  <path d="M 532,1632 H 319" stroke="#dd8c16" stroke-width="18" stroke-linecap="round"/>
  <path d="M 318,1632 l 29,-21 v 42 z" fill="#dd8c16"/>
</svg>
